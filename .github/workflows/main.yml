name: Build ElChapo2 VST3

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows-vst3:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone JUCE 8
        run: git clone --depth 1 --branch 8.0.6 https://github.com C:/JUCE

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DJUCE_DIR=C:/JUCE -DCMAKE_PREFIX_PATH=C:/JUCE

      - name: Build VST3 Release
        run: cmake --build build --config Release

      - name: Upload VST3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElChapo2-Windows-VST3
          path: build/**/*_artefacts/Release/VST3/*.vst3
